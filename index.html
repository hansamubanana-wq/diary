<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>土蔵の罰ゲームクソ日記</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 30px 20px 20px;
    }

    header h1 {
      font-size: 2rem;
      color: #ff6b6b;
      text-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    header p.subtitle {
      font-size: 0.85rem;
      color: #888;
    }

    /* ===== ALERT SECTION ===== */
    #alerts {
      max-width: 800px;
      margin: 0 auto 30px;
    }

    .alert-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #ff4444;
      text-align: center;
      margin-bottom: 10px;
      display: none;
    }

    .alert-title.visible {
      display: block;
    }

    .missing-alert {
      background: #2d0000;
      border: 2px solid #ff0000;
      border-radius: 8px;
      padding: 12px 18px;
      margin-bottom: 8px;
      color: #ff2222;
      font-size: 1.1rem;
      font-weight: bold;
      text-align: center;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { border-color: #ff0000; box-shadow: 0 0 8px rgba(255, 0, 0, 0.4); }
      50%       { border-color: #ff6666; box-shadow: 0 0 18px rgba(255, 0, 0, 0.8); }
    }

    /* ===== DIARY LIST ===== */
    #diary-list {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .day-card {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 12px;
      overflow: hidden;
      transition: box-shadow 0.2s;
    }

    .day-card:hover {
      box-shadow: 0 4px 20px rgba(15, 52, 96, 0.6);
    }

    .day-card.future {
      opacity: 0.5;
    }

    .day-card.missing {
      border-color: #550000;
    }

    .day-card.complete {
      border-color: #1a5c3a;
    }

    .day-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      cursor: pointer;
      user-select: none;
      background: rgba(255,255,255,0.03);
    }

    .day-header:hover {
      background: rgba(255,255,255,0.06);
    }

    .day-label {
      font-size: 1rem;
      font-weight: bold;
      color: #a0c4ff;
    }

    .day-status {
      font-size: 0.8rem;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: bold;
    }

    .status-missing {
      background: #3d0000;
      color: #ff4444;
      border: 1px solid #ff2222;
    }

    .status-complete {
      background: #0d2b1d;
      color: #4caf50;
      border: 1px solid #388e3c;
    }

    .status-future {
      background: #1a1a2e;
      color: #555;
      border: 1px solid #333;
    }

    .status-today {
      background: #1a2e1a;
      color: #ffeb3b;
      border: 1px solid #f9a825;
    }

    .day-body {
      padding: 0 18px 16px;
      display: none;
    }

    .day-body.open {
      display: block;
    }

    .char-hint {
      font-size: 0.75rem;
      color: #666;
      margin-bottom: 6px;
    }

    .diary-textarea {
      width: 100%;
      background: #0d1b2e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      color: #e0e0e0;
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.7;
      padding: 10px 14px;
      resize: vertical;
      min-height: 120px;
      outline: none;
      transition: border-color 0.2s;
    }

    .diary-textarea:focus {
      border-color: #4a90d9;
    }

    .diary-textarea:disabled {
      color: #555;
      cursor: not-allowed;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
    }

    .char-count {
      font-size: 0.8rem;
      color: #666;
    }

    .char-count.enough {
      color: #4caf50;
    }

    .char-count.low {
      color: #ff9800;
    }

    .save-btn {
      background: #0f3460;
      color: #a0c4ff;
      border: 1px solid #4a90d9;
      border-radius: 6px;
      padding: 6px 18px;
      font-size: 0.85rem;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }

    .save-btn:hover {
      background: #1a4f8a;
    }

    .save-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .saved-notice {
      font-size: 0.8rem;
      color: #4caf50;
      display: none;
    }

    .saved-notice.show {
      display: inline;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      padding-bottom: 30px;
      font-size: 0.75rem;
      color: #444;
    }
  </style>
</head>
<body>

<header>
  <h1>土蔵の罰ゲームクソ日記</h1>
  <p class="subtitle">2026年2月16日 〜 3月8日（21日間）｜1日の目安：100文字</p>
</header>

<section id="alerts">
  <p class="alert-title" id="alert-title">⚠️ 書いていない日があります！！！</p>
</section>

<section id="diary-list"></section>

<footer>がんばれ土蔵</footer>

<script>
  // ---- 設定 ----
  const START_DATE = new Date(2026, 1, 16); // 2月16日
  const TOTAL_DAYS = 21;
  const TARGET_CHARS = 100;
  const STORAGE_KEY = 'dozoDiary';

  // ---- ユーティリティ ----
  function dateOf(offset) {
    const d = new Date(START_DATE);
    d.setDate(d.getDate() + offset);
    return d;
  }

  function dateKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function jpDate(d) {
    return `${d.getMonth()+1}月${d.getDate()}日`;
  }

  function jpDateFull(d) {
    const days = ['日','月','火','水','木','金','土'];
    return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${days[d.getDay()]}）`;
  }

  function today() {
    const n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  }

  function loadAll() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch { return {}; }
  }

  function saveAll(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  // ---- 描画 ----
  const data = loadAll();
  const diaryList = document.getElementById('diary-list');
  const alertSection = document.getElementById('alerts');
  const alertTitle = document.getElementById('alert-title');

  for (let i = 0; i < TOTAL_DAYS; i++) {
    const d = dateOf(i);
    const key = dateKey(d);
    const t = today();
    const isPast = d < t;
    const isToday = d.getTime() === t.getTime();
    const isFuture = d > t;
    const entry = data[key] || '';
    const hasEntry = entry.trim().length > 0;

    // ---- カード ----
    const card = document.createElement('div');
    card.className = 'day-card';
    card.id = `card-${key}`;
    if (isFuture) card.classList.add('future');
    else if (!hasEntry && isPast) card.classList.add('missing');
    else if (hasEntry) card.classList.add('complete');

    // ステータスラベル
    let statusClass, statusText;
    if (isFuture) {
      statusClass = 'status-future';
      statusText = '未来';
    } else if (isToday) {
      statusClass = hasEntry ? 'status-complete' : 'status-today';
      statusText = hasEntry ? `✓ ${entry.trim().length}文字` : '今日！';
    } else if (hasEntry) {
      statusClass = 'status-complete';
      statusText = `✓ ${entry.trim().length}文字`;
    } else {
      statusClass = 'status-missing';
      statusText = '未記入';
    }

    card.innerHTML = `
      <div class="day-header" onclick="toggleCard('${key}')">
        <span class="day-label">${jpDateFull(d)}</span>
        <span class="day-status ${statusClass}" id="status-${key}">${statusText}</span>
      </div>
      <div class="day-body" id="body-${key}">
        <p class="char-hint">目安: ${TARGET_CHARS}文字以上</p>
        <textarea
          class="diary-textarea"
          id="ta-${key}"
          placeholder="今日のことを書いてね（目安${TARGET_CHARS}文字）"
          ${isFuture ? 'disabled' : ''}
          oninput="onInput('${key}')"
        >${entry}</textarea>
        <div class="card-footer">
          <span class="char-count ${charClass(entry.trim().length)}" id="cc-${key}">${entry.trim().length} / ${TARGET_CHARS}文字</span>
          <div>
            <span class="saved-notice" id="saved-${key}">保存済み ✓</span>
            <button class="save-btn" id="btn-${key}" onclick="saveEntry('${key}')" ${isFuture ? 'disabled' : ''}>保存</button>
          </div>
        </div>
      </div>
    `;

    diaryList.appendChild(card);

    // 今日のカードは最初から開く
    if (isToday) {
      document.getElementById(`body-${key}`).classList.add('open');
    }
  }

  // ---- アラート（未記入の過去日） ----
  function renderAlerts() {
    const fresh = loadAll();
    // 既存アラートを削除
    alertSection.querySelectorAll('.missing-alert').forEach(el => el.remove());
    alertTitle.classList.remove('visible');

    const t = today();
    let count = 0;
    for (let i = 0; i < TOTAL_DAYS; i++) {
      const d = dateOf(i);
      if (d >= t) continue; // 今日以降はスキップ
      const key = dateKey(d);
      const entry = fresh[key] || '';
      if (!entry.trim()) {
        count++;
        const alert = document.createElement('div');
        alert.className = 'missing-alert';
        alert.textContent = `土蔵は${jpDate(d)}の日記を書いていません！！！`;
        alertSection.appendChild(alert);
      }
    }
    if (count > 0) alertTitle.classList.add('visible');
  }

  renderAlerts();

  // ---- インタラクション ----
  function charClass(n) {
    if (n >= TARGET_CHARS) return 'enough';
    if (n > 0) return 'low';
    return '';
  }

  function onInput(key) {
    const ta = document.getElementById(`ta-${key}`);
    const cc = document.getElementById(`cc-${key}`);
    const n = ta.value.trim().length;
    cc.textContent = `${n} / ${TARGET_CHARS}文字`;
    cc.className = `char-count ${charClass(n)}`;
    document.getElementById(`saved-${key}`).classList.remove('show');
  }

  function saveEntry(key) {
    const ta = document.getElementById(`ta-${key}`);
    const val = ta.value;
    const fresh = loadAll();
    fresh[key] = val;
    saveAll(fresh);

    // カードスタイル更新
    const card = document.getElementById(`card-${key}`);
    const hasEntry = val.trim().length > 0;
    card.classList.toggle('missing', !hasEntry);
    card.classList.toggle('complete', hasEntry);

    // ステータス更新
    const statusEl = document.getElementById(`status-${key}`);
    const n = val.trim().length;
    if (hasEntry) {
      statusEl.className = 'day-status status-complete';
      statusEl.textContent = `✓ ${n}文字`;
    } else {
      const d = new Date(key.replace(/-/g, '/'));
      const t = today();
      statusEl.className = `day-status ${d.getTime() === t.getTime() ? 'status-today' : 'status-missing'}`;
      statusEl.textContent = d.getTime() === t.getTime() ? '今日！' : '未記入';
    }

    // 保存済み表示
    const savedEl = document.getElementById(`saved-${key}`);
    savedEl.classList.add('show');
    setTimeout(() => savedEl.classList.remove('show'), 2000);

    // アラート再描画
    renderAlerts();
  }

  function toggleCard(key) {
    const body = document.getElementById(`body-${key}`);
    body.classList.toggle('open');
  }
</script>
</body>
</html>
